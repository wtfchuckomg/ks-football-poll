# Overall records from KPreps' district standings for the live week, into kprecords.json.
# Runs Monday at 6 a.m. in Kansas, after voting locks at midnight Sunday, unless the week is already released.
name: KPreps records

on:
  schedule:
    # 6 a.m. in Kansas is 11:00 UTC in summer (CDT) and 12:00 in winter (CST). Both are listed; the first
    # step lets through only the one that is 6 a.m. in Kansas.
    - cron: '0 11 * * 1'
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Fill the live week even if it has already been released
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: kprecords
  cancel-in-progress: false

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - name: Is it 6 a.m. in Kansas?
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=America/Chicago date +%H)" = "06" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Not 6 a.m. in Kansas; the other run has it."; fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.go == '1'
      - name: Read records from KPreps
        if: steps.when.outputs.go == '1'
        run: python3 .github/kp_records.py ${{ inputs.force && '--force' || '' }}
      - name: Save and publish any changes
        if: steps.when.outputs.go == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add kprecords.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="KPreps records" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "KPreps records for the live week"
          git pull -q --rebase && git push -q
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
